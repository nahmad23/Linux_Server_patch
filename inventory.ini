# Example inventory for patch-ubuntu.yml
#
# Group hosts under [ubuntu] (the playbook targets the "ubuntu" group).
# Adjust ansible_user / connection details to match your environment.

[ubuntu:children]
web
db

[web]
web01.example.com
web02.example.com

[db]
db01.example.com

[ubuntu:vars]
ansible_user=ubuntu
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
