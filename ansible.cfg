[defaults]
# Number of hosts Ansible talks to at the same time.
# Default is 5, which would throttle a "50% of fleet" wave. Raise it so the
# whole serial batch runs in parallel. Set this to at least 50% of your total
# server count (bump higher for larger fleets).
forks = 50

# Don't fail a whole run just because SSH host keys aren't cached yet.
host_key_checking = False

# Show task timing and a clean recap.
stdout_callback = default
