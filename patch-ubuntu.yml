---
# patch-ubuntu.yml
#
# Patch Ubuntu servers with "apt upgrade", fix any broken dpkg state,
# reboot every server that actually got patched, and email a final
# patching status report.
#
# Usage:
#   ansible-playbook -i inventory.ini patch-ubuntu.yml
#   ansible-playbook -i inventory.ini patch-ubuntu.yml --check   # dry run
#   ansible-playbook -i inventory.ini patch-ubuntu.yml --limit web
#
# Email requires the community.general collection on the control node:
#   ansible-galaxy collection install community.general
# and a working SMTP relay (set smtp_host/smtp_port below).

# ===========================================================================
# PLAY 1 : Patch every host
# ===========================================================================
- name: Patch Ubuntu servers
  hosts: ubuntu
  become: true
  any_errors_fatal: false      # one bad host must not stop the others

  # apt_upgrade_type and reboot_timeout come from group_vars/ubuntu.yml
  # (defaults applied inline below if unset).

  tasks:
    - name: Patch this host
      block:

        # 1. Fix any half-configured / broken dpkg state first.
        - name: Fix dpkg state (dpkg --configure -a)
          ansible.builtin.command: dpkg --configure -a
          register: dpkg_fix
          changed_when: dpkg_fix.stdout | length > 0

        # 2. Update the package list.
        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: true

        # 3. Patch with apt upgrade.
        - name: Run apt upgrade
          ansible.builtin.apt:
            upgrade: "{{ apt_upgrade_type | default('safe') }}"
          register: apt_upgrade

        # 4. Clean up.
        - name: Remove unused dependencies and clean cache
          ansible.builtin.apt:
            autoremove: true
            autoclean: true

        # 5. MANDATORY reboot when this host was actually patched.
        - name: Reboot the host because it was patched
          ansible.builtin.reboot:
            msg: "Reboot after Ansible patching"
            reboot_timeout: "{{ reboot_timeout | default(600) }}"
          when:
            - apt_upgrade is changed
            - not ansible_check_mode

        # 6. Record the result for the report.
        - name: Mark host SUCCESS
          ansible.builtin.set_fact:
            patch_status: "SUCCESS"
            patch_rebooted: "{{ apt_upgrade is changed }}"

      rescue:
        - name: Mark host FAILED
          ansible.builtin.set_fact:
            patch_status: "FAILED"
            patch_rebooted: false
            patch_error: "{{ ansible_failed_result.msg | default('see task output') }}"

# ===========================================================================
# PLAY 2 : Build + show + email the patching status report
# ===========================================================================
- name: Send patching status report
  hosts: ubuntu
  gather_facts: false
  run_once: true

  vars:
    # Email settings (mail_to / mail_from / smtp_host / smtp_port) come from
    # group_vars/ubuntu.yml. Inline defaults below are used only if unset.

    # --- categorise hosts by result ---
    host_facts: "{{ ansible_play_hosts_all | map('extract', hostvars) | list }}"
    succeeded: "{{ host_facts | selectattr('patch_status', 'defined') | selectattr('patch_status', 'equalto', 'SUCCESS') | map(attribute='inventory_hostname') | list }}"
    failed: "{{ host_facts | selectattr('patch_status', 'defined') | selectattr('patch_status', 'equalto', 'FAILED') | map(attribute='inventory_hostname') | list }}"
    unreached: "{{ host_facts | rejectattr('patch_status', 'defined') | map(attribute='inventory_hostname') | list }}"
    rebooted: "{{ host_facts | selectattr('patch_rebooted', 'defined') | selectattr('patch_rebooted', 'equalto', true) | map(attribute='inventory_hostname') | list }}"

    report_body: |
      Ubuntu patching report - {{ ansible_date_time.date | default('') }}

      SUCCESS  ({{ succeeded | length }}): {{ succeeded | join(', ') or 'none' }}
      FAILED   ({{ failed | length }}): {{ failed | join(', ') or 'none' }}
      SKIPPED  ({{ unreached | length }}): {{ unreached | join(', ') or 'none' }}
      REBOOTED ({{ rebooted | length }}): {{ rebooted | join(', ') or 'none' }}

  tasks:
    - name: Show patch summary on screen
      ansible.builtin.debug:
        msg: "{{ report_body.split('\n') }}"

    - name: Email the patch report
      community.general.mail:
        host: "{{ smtp_host | default('localhost') }}"
        port: "{{ smtp_port | default(25) }}"
        to: "{{ mail_to | default('nawazish.ahmad@unitedlex.com') }}"
        from: "{{ mail_from | default('ansible-patching@unitedlex.com') }}"
        subject: "Ubuntu Patching Report - {{ failed | length }} failed / {{ succeeded | length }} success"
        body: "{{ report_body }}"
      delegate_to: localhost
      when: not ansible_check_mode
