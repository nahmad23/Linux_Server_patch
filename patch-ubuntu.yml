---
# patch-ubuntu.yml
#
# Patch Ubuntu servers with "apt upgrade" and print a final summary of
# which servers succeeded and which failed.
#
# Usage:
#   ansible-playbook -i inventory.ini patch-ubuntu.yml
#
#   # Dry run (report available updates, change nothing):
#   ansible-playbook -i inventory.ini patch-ubuntu.yml --check
#
#   # Limit to a subset of hosts:
#   ansible-playbook -i inventory.ini patch-ubuntu.yml --limit web
#
# Notes:
#   - Each host's patching is wrapped in block/rescue so one failing host
#     does NOT abort the run. The result is recorded per host and printed
#     in a final summary at the end.
#   - A reboot happens only when /var/run/reboot-required exists.

- name: Patch Ubuntu servers with apt upgrade
  hosts: ubuntu
  become: true
  # Keep going on all hosts even if some fail, so we can report them all.
  any_errors_fatal: false
  max_fail_percentage: 100

  vars:
    # Set to "dist" for full dist-upgrade, "full", or "safe".
    apt_upgrade_type: "safe"
    apt_autoremove: true
    apt_autoclean: true
    reboot_timeout: 600
    apt_cache_valid_time: 3600

  tasks:
    - name: Patch this host
      block:
        - name: Confirm host is an Ubuntu/Debian family system
          ansible.builtin.assert:
            that:
              - ansible_facts['os_family'] == 'Debian'
            fail_msg: "This playbook targets Debian/Ubuntu hosts only."
            quiet: true

        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: "{{ apt_cache_valid_time }}"

        - name: Run apt upgrade
          ansible.builtin.apt:
            upgrade: "{{ apt_upgrade_type }}"
            update_cache: true
            cache_valid_time: "{{ apt_cache_valid_time }}"
          register: apt_upgrade

        - name: Remove unused dependencies
          ansible.builtin.apt:
            autoremove: true
          when: apt_autoremove | bool

        - name: Clean obsolete packages from the cache
          ansible.builtin.apt:
            autoclean: true
          when: apt_autoclean | bool

        - name: Check whether a reboot is required
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_required_file

        - name: Reboot the host if required
          ansible.builtin.reboot:
            msg: "Reboot triggered by Ansible after patching"
            reboot_timeout: "{{ reboot_timeout }}"
            test_command: uptime
          when:
            - reboot_required_file.stat.exists
            - not ansible_check_mode

        - name: Mark this host as successfully patched
          ansible.builtin.set_fact:
            patch_status: "SUCCESS"
            patch_rebooted: "{{ reboot_required_file.stat.exists | default(false) }}"
            patch_changed: "{{ apt_upgrade.changed | default(false) }}"

      rescue:
        - name: Mark this host as failed
          ansible.builtin.set_fact:
            patch_status: "FAILED"
            patch_rebooted: false
            patch_changed: false
            patch_error: "{{ ansible_failed_result.msg | default('see task output above') }}"

        - name: Log the failure (do not abort the run)
          ansible.builtin.debug:
            msg: "Patching FAILED on {{ inventory_hostname }}: {{ patch_error }}"

# ---------------------------------------------------------------------------
# Final summary play — runs once and prints the result for every host.
# ---------------------------------------------------------------------------
- name: Patch summary
  hosts: ubuntu
  gather_facts: false
  run_once: true

  vars:
    # All hosts that were targeted in this run.
    all_hosts: "{{ ansible_play_hosts_all }}"
    succeeded: >-
      {{ all_hosts
         | map('extract', hostvars, 'patch_status')
         | list
         | zip(all_hosts)
         | selectattr('0', 'equalto', 'SUCCESS')
         | map(attribute='1') | list }}
    failed: >-
      {{ all_hosts
         | map('extract', hostvars, 'patch_status')
         | list
         | zip(all_hosts)
         | selectattr('0', 'equalto', 'FAILED')
         | map(attribute='1') | list }}
    unreached: >-
      {{ all_hosts
         | map('extract', hostvars, 'patch_status')
         | list
         | zip(all_hosts)
         | rejectattr('0', 'in', ['SUCCESS', 'FAILED'])
         | map(attribute='1') | list }}
    rebooted: >-
      {{ all_hosts
         | map('extract', hostvars, 'patch_rebooted')
         | list
         | zip(all_hosts)
         | selectattr('0', 'equalto', true)
         | map(attribute='1') | list }}

  tasks:
    - name: Show patch summary
      ansible.builtin.debug:
        msg:
          - "================== PATCH SUMMARY =================="
          - "SUCCESS              ({{ succeeded | length }}): {{ succeeded }}"
          - "FAILED               ({{ failed | length }}): {{ failed }}"
          - "UNREACHABLE/SKIPPED  ({{ unreached | length }}): {{ unreached }}"
          - "REBOOTED             ({{ rebooted | length }}): {{ rebooted }}"
          - "=================================================="
