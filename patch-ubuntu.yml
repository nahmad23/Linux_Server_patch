---
# patch-ubuntu.yml
#
# Patch Ubuntu servers with "apt upgrade", fix any broken dpkg state,
# reboot every server whose patching succeeded, and print a final
# patching status summary on screen.
#
# Usage:
#   ansible-playbook -i inventory.ini patch-ubuntu.yml
#   ansible-playbook -i inventory.ini patch-ubuntu.yml --check   # dry run
#   ansible-playbook -i inventory.ini patch-ubuntu.yml --limit web

# ===========================================================================
# PLAY 1 : Patch every host
# ===========================================================================
- name: Patch Ubuntu servers
  hosts: ubuntu
  become: true
  any_errors_fatal: false               # one bad host must not stop the others
  serial: "{{ patch_serial | default('50%') }}"   # patch 50% of hosts at a time

  # apt_upgrade_type and reboot_timeout come from group_vars/ubuntu.yml
  # (defaults applied inline below if unset).

  tasks:
    - name: Patch this host
      # Answer every debconf / dpkg prompt automatically (no interactive
      # "yes/no" questions): run non-interactively and keep existing config
      # files on any conffile prompt.
      environment:
        DEBIAN_FRONTEND: noninteractive
      block:

        # 1. Fix any half-configured / broken dpkg state first.
        #    --force-confdef/--force-confold auto-answer config-file prompts.
        #    Retried so a transient dpkg lock (e.g. unattended-upgrades) does
        #    not fail the host outright.
        - name: Fix dpkg state (dpkg --configure -a)
          ansible.builtin.command: dpkg --configure -a --force-confdef --force-confold
          register: dpkg_fix
          changed_when: dpkg_fix.stdout | length > 0
          retries: 5
          delay: 30
          until: dpkg_fix is succeeded

        # 2. Update the package list.
        #    Non-fatal: retry a few times, but if it still fails we continue
        #    and patch with the existing cache instead of breaking the run.
        - name: Update apt cache (non-fatal — patch even if this fails)
          ansible.builtin.apt:
            update_cache: true
            lock_timeout: 60
          register: apt_cache
          retries: 2
          delay: 5
          until: apt_cache is succeeded
          ignore_errors: true

        # 3. Patch with apt upgrade (auto-answer all prompts).
        #    lock_timeout waits up to 5 min for the dpkg lock instead of
        #    failing instantly; retried for transient lock/network errors.
        - name: Run apt upgrade
          ansible.builtin.apt:
            upgrade: "{{ apt_upgrade_type | default('safe') }}"
            dpkg_options: "force-confdef,force-confold"
            lock_timeout: 300
          register: apt_upgrade
          retries: 3
          delay: 30
          until: apt_upgrade is succeeded

        # 4a. Remove unused/orphaned dependency packages.
        - name: Remove unused dependencies (autoremove)
          ansible.builtin.apt:
            autoremove: true
            purge: false
            lock_timeout: 300

        # 4b. Clean obsolete .deb files from the local cache.
        - name: Clean apt cache (autoclean)
          ansible.builtin.apt:
            autoclean: true
            lock_timeout: 300

        # 5. Reboot EVERY host whose patching succeeded (reached this point),
        #    whether or not new packages were installed.
        - name: Reboot the host after successful patching
          ansible.builtin.reboot:
            msg: "Reboot after Ansible patching"
            reboot_timeout: "{{ reboot_timeout | default(900) }}"
          when: not ansible_check_mode

        # 6. Record the result for the summary.
        - name: Mark host SUCCESS
          ansible.builtin.set_fact:
            patch_status: "SUCCESS"
            patch_rebooted: "{{ not ansible_check_mode }}"

      rescue:
        - name: Mark host FAILED
          ansible.builtin.set_fact:
            patch_status: "FAILED"
            patch_rebooted: false
            patch_error: "{{ ansible_failed_result.msg | default('see task output') }}"

# ===========================================================================
# PLAY 2 : Print the patching status summary
# ===========================================================================
- name: Patch summary
  hosts: ubuntu
  gather_facts: false
  run_once: true

  vars:
    host_facts: "{{ ansible_play_hosts_all | map('extract', hostvars) | list }}"
    succeeded: >-
      {{ host_facts | selectattr('patch_status', 'defined')
         | selectattr('patch_status', 'equalto', 'SUCCESS')
         | map(attribute='inventory_hostname') | list }}
    failed: >-
      {{ host_facts | selectattr('patch_status', 'defined')
         | selectattr('patch_status', 'equalto', 'FAILED')
         | map(attribute='inventory_hostname') | list }}
    unreached: >-
      {{ host_facts | rejectattr('patch_status', 'defined')
         | map(attribute='inventory_hostname') | list }}
    rebooted: >-
      {{ host_facts | selectattr('patch_rebooted', 'defined')
         | selectattr('patch_rebooted', 'equalto', true)
         | map(attribute='inventory_hostname') | list }}

  tasks:
    - name: Show patch summary
      ansible.builtin.debug:
        msg:
          - "================== PATCH SUMMARY =================="
          - "SUCCESS              ({{ succeeded | length }}): {{ succeeded }}"
          - "FAILED               ({{ failed | length }}): {{ failed }}"
          - "UNREACHABLE/SKIPPED  ({{ unreached | length }}): {{ unreached }}"
          - "REBOOTED             ({{ rebooted | length }}): {{ rebooted }}"
          - "=================================================="

    # Print WHY each failed host failed, so failures can be diagnosed.
    - name: Show failure reason per failed host
      ansible.builtin.debug:
        msg: "{{ item }} FAILED: {{ hostvars[item].patch_error | default('see the task output above for this host') }}"
      loop: "{{ failed }}"
      when: failed | length > 0
