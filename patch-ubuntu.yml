---
# patch-ubuntu.yml
#
# Patch Ubuntu servers with "apt upgrade", fix any broken dpkg state,
# reboot every server that actually got patched, and print a final
# patching status summary on screen.
#
# Usage:
#   ansible-playbook -i inventory.ini patch-ubuntu.yml
#   ansible-playbook -i inventory.ini patch-ubuntu.yml --check   # dry run
#   ansible-playbook -i inventory.ini patch-ubuntu.yml --limit web

# ===========================================================================
# PLAY 1 : Patch every host
# ===========================================================================
- name: Patch Ubuntu servers
  hosts: ubuntu
  become: true
  any_errors_fatal: false      # one bad host must not stop the others

  # apt_upgrade_type and reboot_timeout come from group_vars/ubuntu.yml
  # (defaults applied inline below if unset).

  tasks:
    - name: Patch this host
      block:

        # 1. Fix any half-configured / broken dpkg state first.
        - name: Fix dpkg state (dpkg --configure -a)
          ansible.builtin.command: dpkg --configure -a
          register: dpkg_fix
          changed_when: dpkg_fix.stdout | length > 0

        # 2. Update the package list.
        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: true

        # 3. Patch with apt upgrade.
        - name: Run apt upgrade
          ansible.builtin.apt:
            upgrade: "{{ apt_upgrade_type | default('safe') }}"
          register: apt_upgrade

        # 4. Clean up.
        - name: Remove unused dependencies and clean cache
          ansible.builtin.apt:
            autoremove: true
            autoclean: true

        # 5. MANDATORY reboot when this host was actually patched.
        - name: Reboot the host because it was patched
          ansible.builtin.reboot:
            msg: "Reboot after Ansible patching"
            reboot_timeout: "{{ reboot_timeout | default(600) }}"
          when:
            - apt_upgrade is changed
            - not ansible_check_mode

        # 6. Record the result for the summary.
        - name: Mark host SUCCESS
          ansible.builtin.set_fact:
            patch_status: "SUCCESS"
            patch_rebooted: "{{ apt_upgrade is changed }}"

      rescue:
        - name: Mark host FAILED
          ansible.builtin.set_fact:
            patch_status: "FAILED"
            patch_rebooted: false
            patch_error: "{{ ansible_failed_result.msg | default('see task output') }}"

# ===========================================================================
# PLAY 2 : Print the patching status summary
# ===========================================================================
- name: Patch summary
  hosts: ubuntu
  gather_facts: false
  run_once: true

  vars:
    host_facts: "{{ ansible_play_hosts_all | map('extract', hostvars) | list }}"
    succeeded: >-
      {{ host_facts | selectattr('patch_status', 'defined')
         | selectattr('patch_status', 'equalto', 'SUCCESS')
         | map(attribute='inventory_hostname') | list }}
    failed: >-
      {{ host_facts | selectattr('patch_status', 'defined')
         | selectattr('patch_status', 'equalto', 'FAILED')
         | map(attribute='inventory_hostname') | list }}
    unreached: >-
      {{ host_facts | rejectattr('patch_status', 'defined')
         | map(attribute='inventory_hostname') | list }}
    rebooted: >-
      {{ host_facts | selectattr('patch_rebooted', 'defined')
         | selectattr('patch_rebooted', 'equalto', true)
         | map(attribute='inventory_hostname') | list }}

  tasks:
    - name: Show patch summary
      ansible.builtin.debug:
        msg:
          - "================== PATCH SUMMARY =================="
          - "SUCCESS              ({{ succeeded | length }}): {{ succeeded }}"
          - "FAILED               ({{ failed | length }}): {{ failed }}"
          - "UNREACHABLE/SKIPPED  ({{ unreached | length }}): {{ unreached }}"
          - "REBOOTED             ({{ rebooted | length }}): {{ rebooted }}"
          - "=================================================="
