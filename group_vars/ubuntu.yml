---
# group_vars/ubuntu.yml
#
# Settings for the "ubuntu" host group. Edit these instead of the playbook.
# Anything set here is applied to every host in the [ubuntu] inventory group.

# --- Patching ---
apt_upgrade_type: "safe"        # "safe", "dist", or "full"
reboot_timeout: 600             # seconds to wait for a host after reboot

# --- Email report ---
mail_to: "nawazish.ahmad@unitedlex.com"
mail_from: "ansible-patching@unitedlex.com"
smtp_host: "localhost"          # your SMTP relay (e.g. smtp.unitedlex.com)
smtp_port: 25
